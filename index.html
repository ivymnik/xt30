<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Подсказчик X-T30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --surface2:#F5F6F8; --ink:#14171B; --muted:#58606A; --line:#D8DCE1;
  --accent:#C8201A; --accent-ink:#FFFFFF;
  --rot:#C8201A; --rot-bg:#FBEAE8; --press:#2A5DB0; --press-bg:#E7EEF9;
  --ok:#1C7248; --ok-bg:#E3F2E9; --warn-line:#D99A00; --warn-bg:#FFF3CF; --warn-ink:#453300;
  --cam:#2B2E33; --cam2:#3B3F45; --metal:#565B62; --cam-ink:#FFFFFF; --sel:#FFC53D;
  --chip:#FFFFFF; --chip-on:#14171B; --chip-on-ink:#FFFFFF;
  --lcd:#17202A; --lcd-ink:#E6EEF4; --lcd-dim:#8398A9; --lcd-hi:#FFCF3F; --lcd-line:#2B3845;
  --shadow:0 1px 2px rgba(20,23,27,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1113; --surface:#181B1F; --surface2:#1E2227; --ink:#E9ECEF; --muted:#9AA3AD; --line:#2A2F35;
    --accent:#FF5B4D; --accent-ink:#1A0B0A;
    --rot:#FF6A5C; --rot-bg:#381B19; --press:#79A8F0; --press-bg:#16233A;
    --ok:#4CC486; --ok-bg:#132D20; --warn-line:#E6B42E; --warn-bg:#322810; --warn-ink:#FFE08A;
    --cam:#2A2D32; --cam2:#373B41; --metal:#4E535A; --sel:#FFC53D;
    --chip:#181B1F; --chip-on:#E9ECEF; --chip-on-ink:#0F1113;
    --lcd:#0A0F14; --lcd-ink:#E6EEF4; --lcd-dim:#7A8FA0; --lcd-hi:#FFCF3F; --lcd-line:#223040;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1113; --surface:#181B1F; --surface2:#1E2227; --ink:#E9ECEF; --muted:#9AA3AD; --line:#2A2F35;
  --accent:#FF5B4D; --accent-ink:#1A0B0A;
  --rot:#FF6A5C; --rot-bg:#381B19; --press:#79A8F0; --press-bg:#16233A;
  --ok:#4CC486; --ok-bg:#132D20; --warn-line:#E6B42E; --warn-bg:#322810; --warn-ink:#FFE08A;
  --cam:#2A2D32; --cam2:#373B41; --metal:#4E535A; --sel:#FFC53D;
  --chip:#181B1F; --chip-on:#E9ECEF; --chip-on-ink:#0F1113;
  --lcd:#0A0F14; --lcd-ink:#E6EEF4; --lcd-dim:#7A8FA0; --lcd-hi:#FFCF3F; --lcd-line:#223040;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
header{display:grid;gap:6px}
.brand{display:flex;gap:8px;align-items:center;font:700 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand b{background:var(--accent);color:var(--accent-ink);padding:5px 8px;border-radius:4px;letter-spacing:.06em}
h1{font-family:var(--display);font-size:clamp(34px,6vw,58px);line-height:.98;margin:4px 0 0;font-weight:700;letter-spacing:-.005em;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{margin:4px 0 0;color:var(--muted);max-width:62ch;font-size:15.5px}
.layout{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:18px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.pick{position:static}}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
legend{padding:0;margin-bottom:10px;font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:9px;align-items:center}
legend .n{font:700 12px/1 "JetBrains Mono",monospace;background:var(--ink);color:var(--bg);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:600 14px/1.2 "Onest",sans-serif;padding:9px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:3px solid var(--press);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--chip);color:var(--ink);font:600 13.5px/1.25 "Onest",sans-serif;padding:10px 8px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.hint{font-size:13px;color:var(--muted);margin:0}

.result{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.mode{font:700 50px/1 var(--display);background:var(--lcd);color:var(--lcd-hi);width:72px;height:72px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px var(--lcd-line)}
.head{flex-wrap:nowrap}.head>div:last-child{min-width:0}
.head h2{margin:0 0 6px;font:700 28px/1.02 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:15px;max-width:66ch}
.head .where{font:700 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:2px 0 6px}
@media (max-width:560px){.mode{width:54px;height:54px;font-size:38px;border-radius:10px}.head h2{font-size:24px}.head{gap:12px}}
@media (max-width:760px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap;padding:12px 10px;font-size:17px}}
.summary{margin-top:14px;display:flex;flex-wrap:wrap;background:var(--lcd);border-radius:10px;padding:8px 6px;box-shadow:inset 0 0 0 1px var(--lcd-line)}
.summary span{font:700 13px/1 var(--mono);color:var(--lcd-ink);padding:6px 10px;font-variant-numeric:tabular-nums;border-right:1px solid var(--lcd-line)}
.summary span:first-child{color:var(--lcd-hi)}
.summary span:last-child{border-right:0;color:var(--lcd-hi)}

.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.g svg.ph,svg.ph{max-width:none;width:100%;height:auto;display:block;border-radius:10px;background:#FAFAF7;border:1px solid var(--line)}
.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.mapgrid{grid-template-columns:1fr}}
.mapcard h2{font:700 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
.keylist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.keylist li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.35}
.keylist .kn{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font:800 12px/1 "Onest",sans-serif}
.keylist small{display:block;color:var(--muted);font-size:12.5px}
.menuph{margin-top:10px}
.shotgrid{display:grid;grid-template-columns:1fr;gap:16px}
.shotgrid>div:first-child{max-width:680px}
.shotgrid .shotlist{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media (max-width:640px){.shotgrid .shotlist{grid-template-columns:1fr}}
svg.sk{width:100%;height:auto;display:block;border-radius:10px}
.skcap{margin:6px 2px 0;font-size:12px;color:var(--muted)}
.shotlist{margin:0;display:grid;gap:10px}
.shotlist div{display:grid;gap:2px;align-content:start}
.shotlist dt{font:700 15px/1.1 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.shotlist dd{margin:0;font-size:15px;line-height:1.45}
@media (max-width:560px){.gauges{grid-template-columns:1fr}}
.g{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;display:grid;gap:6px;justify-items:center;text-align:center;min-width:0}
.g svg{width:100%;max-width:150px;height:auto;display:block}
.g .lab{font:600 15px/1 var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.g .val{font:700 26px/1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.g .sub{font-size:12.5px;color:var(--muted);line-height:1.3}

h3{margin:0 0 12px;font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:9px;align-items:center}
h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;font-size:15px}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 14px/1 "Onest",sans-serif}
ol.steps li.r{background:var(--rot-bg)} ol.steps li.r::before{background:var(--rot)}
ol.steps li.p{background:var(--press-bg)} ol.steps li.p::before{background:var(--press)}
.path{font:700 13.5px/1.5 "JetBrains Mono",monospace;word-break:break-word}
.path em{font-style:normal;color:var(--press);padding:0 2px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:980px){.twocol{grid-template-columns:1fr}}
.notes{display:grid;gap:8px}
.note{border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.note.tip{background:var(--ok-bg)} .note.tip b{color:var(--ok)}
.note.warn{background:var(--warn-bg);border:1.5px solid var(--warn-line);color:var(--warn-ink)}
.note.block{background:var(--warn-bg);border:2px solid var(--warn-line);color:var(--warn-ink);font-size:16px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 20px}
summary{cursor:pointer;font-weight:800}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.m{font-family:"JetBrains Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
footer{font-size:12.5px;color:var(--muted)}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
[hidden]{display:none!important}
.stylebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.stylebar .lang{margin-left:auto}
.feedback p{margin:0 0 12px;max-width:62ch}
.mailrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mail{font:700 16px/1.2 var(--mono);color:var(--ink);text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:2px;user-select:all;word-break:break-all}
.copy{appearance:none;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:600 13.5px/1 "Onest",sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
.copy:hover{border-color:var(--muted)}
.copy:focus-visible,.mail:focus-visible{outline:3px solid var(--press);outline-offset:2px}
.seg.mini{display:inline-grid;grid-template-columns:auto auto}
.seg.mini button{padding:7px 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:0}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;padding:12px 14px;border-bottom:3px solid transparent;margin-bottom:-1.5px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--press);outline-offset:2px}
.lensbar{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.lensbar b{font-family:"JetBrains Mono",monospace}
.mtab{display:grid;gap:12px}
.mgroup h2{font:700 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 6px}
.mgroup .sub{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.mrows{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.mrow.change{border-color:var(--rot);background:var(--rot-bg)}
.mrow.preset{border-color:transparent}
.mrow .nm{font:700 13.5px/1.35 "JetBrains Mono",monospace}
.mrow .wh{font-size:14px;line-height:1.4}
.mrow .wh small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.mrow .now,.mrow .set{font-size:13.5px}
.mrow .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:2px}
.mrow .set b{color:var(--ink)}
.badge{display:inline-block;font:800 11px/1 "Onest",sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;margin-bottom:4px}
.badge.change{background:var(--rot);color:#fff}
.badge.keep{background:var(--ok-bg);color:var(--ok)}
.badge.preset{background:var(--press-bg);color:var(--press)}
.badge.rare{background:var(--line);color:var(--muted)}
@media (max-width:760px){.mrow{grid-template-columns:1fr}}
.mrow.info{background:var(--surface)}
.badge.info{background:var(--ink);color:var(--bg)}
.opts{grid-column:1/-1;background:none;border:0;border-top:1px dashed var(--line);border-radius:0;padding:8px 0 0}
.opts summary{font:700 13px/1.2 var(--mono);color:var(--press);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.opts dl{margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px}
.opts dl div{display:grid;gap:2px;align-content:start}
.opts dt{font:700 13px/1.3 var(--mono)}
.opts dd{margin:0;font-size:14px;line-height:1.4;color:var(--muted)}
.legendrow{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);align-items:center}
.sets th:first-child,.sets td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.sets td{font-family:"JetBrains Mono",monospace;font-size:13px;white-space:nowrap}
.sets td:first-child{font-weight:700}
.sets th{white-space:nowrap}
.howto{display:grid;gap:8px;counter-reset:h;list-style:none;padding:0;margin:0}
.howto li{counter-increment:h;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px}
.howto li::before{content:counter(h);width:26px;height:26px;border-radius:50%;background:var(--press);color:#fff;display:grid;place-items:center;font:800 13px/1 "Onest",sans-serif}
.bank{font:800 13px/1 "JetBrains Mono",monospace;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px}
</style>

<div id="app"></div>
<template id="tpl-ru">
<div class="wrap">
  <header>
    <div class="brand"><b>X-T30</b> + XF 18–55 мм f/2,8–4</div>
    <h1>Где снимаете — <span>что поставить</span></h1>
    <p class="lead">Выберите место, свет и сюжет — справа появится, что повернуть на камере и что выбрать в меню. Названия пунктов — как на русском экране вашей камеры. Все числа — стартовая точка.</p>
  </header>

  <div class="stylebar"><span>Вид камеры:</span><div class="seg mini" id="style" role="group" aria-label="Вид камеры">
    <button type="button" id="st-draw" data-v="draw">Рисунки</button><button type="button" id="st-photo" data-v="photo">Фото</button></div>
    <div class="seg mini lang" id="lang" role="group" aria-label="Язык / Language"><button type="button" id="lg-ru" data-lang="ru">RU</button><button type="button" id="lg-en" data-lang="en">EN</button></div></div>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" id="tab-tool" data-tab="tool" aria-selected="true">Подсказчик</button>
    <button class="tab" role="tab" id="tab-map" data-tab="map" aria-selected="false">Карта камеры</button>
    <button class="tab" role="tab" id="tab-menu" data-tab="menu" aria-selected="false">Меню камеры</button>
    <button class="tab" role="tab" id="tab-sets" data-tab="sets" aria-selected="false">Наборы C1–C7</button>
  </nav>

  <!-- ============ TOOL ============ -->
  <section id="pane-tool" role="tabpanel" aria-labelledby="tab-tool" class="wrap">
  <div class="layout">
    <form class="pick" id="pick" onsubmit="return false">
      <fieldset>
        <legend><span class="n">1</span>Где снимаете</legend>
        <div class="seg" id="place" role="group" aria-label="Место">
          <button type="button" id="pl-out" data-v="out">На улице</button>
          <button type="button" id="pl-in" data-v="in">В помещении</button>
        </div>
      </fieldset>
      <fieldset>
        <legend><span class="n">2</span>Какой свет</legend>
        <div class="chips" id="where"></div>
      </fieldset>
      <fieldset>
        <legend><span class="n">3</span>Что снимаете</legend>
        <div class="chips" id="what"></div>
      </fieldset>
      <fieldset>
        <legend><span class="n">4</span>Штатив</legend>
        <div class="seg" id="tripod" role="group" aria-label="Штатив">
          <button type="button" id="tp-no" data-v="no">Без штатива</button>
          <button type="button" id="tp-yes" data-v="yes">Есть штатив</button>
        </div>
      </fieldset>
      <div class="lensbar"><div>Объектив: <b>XF 18–55 мм f/2,8–4</b>. На 18 мм самое светлое f/2,8, на 55 мм — f/4. Кольцо диафрагмы без цифр: значение видно на экране.</div></div>
    </form>
    <main class="result" id="result" aria-live="polite"></main>
  </div>
  </section>

  <!-- ============ MAP ============ -->
  <section id="pane-map" role="tabpanel" aria-labelledby="tab-map" class="mtab" hidden>
    <div class="card"><p style="margin:0">Ваша камера на ваших фото. Красным — то, что <b>крутят и переключают</b>, синим — кнопки, которые <b>нажимают</b>.</p></div>
    <div class="mapgrid" id="mapList"></div>
  </section>

  <!-- ============ MENU ============ -->
  <section id="pane-menu" role="tabpanel" aria-labelledby="tab-menu" class="mtab" hidden>
    <div class="card">
      <p style="margin:0 0 10px">Что поставить в меню X-T30 и что значит каждый вариант. <b>Красные строки</b> — важные: поставьте один раз и забудьте. Синие меняются наборами C1–C7, их по отдельности крутить не нужно. Нажмите «Все варианты», чтобы увидеть остальные значения пункта.</p>
      <div class="legendrow"><span class="badge change">важно</span><span class="badge keep">по умолчанию</span><span class="badge preset">в наборах C1–C7</span><span class="badge rare">не трогать</span><span class="badge info">справка</span></div>
    </div>
    <div id="menuList" class="mtab"></div>
  </section>

  <!-- ============ SETS ============ -->

/* A drawn shape group: paper halo (separates overlapping figures) + tone + pencil hatching */
function fig(parts, tone, o = {}){
  const hw = o.hw ?? 3, hat = o.hatch ?? "url(#pzh)";
  const one = (p, pass) => {
    const c = pass === 0 ? PAPER : pass === 1 ? (p.c || tone) : hat;
    if (p.l) return `<polyline points="${pts(p.l)}" fill="none" stroke="${c}" stroke-width="${p.w + (pass === 0 ? hw : 0)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    return p.s.replace("/>", pass === 0 ? ` fill="${PAPER}" stroke="${PAPER}" stroke-width="${hw}" stroke-linejoin="round"/>` : ` fill="${c}"/>`);
  };
  const halo = o.halo === false ? "" : parts.map(p => one(p, 0)).join("");
  const body = parts.map(p => one(p, 1)).join("");
  const h = hat === "none" ? "" : parts.filter(p => !p.nh).map(p => one(p, 2)).join("");
  return `<g filter="url(#pzW)"${o.op ? ` opacity="${o.op}"` : ""}>${halo}${body}${h}</g>`;
}
const Sp = (d, c, nh) => ({ s: `<path d="${d}"/>`, c, nh });

/* Human figure. o: kind adult|child, fem, hair short|long|bun, dress, pose stand|walk|sit, arms down|front|reach, tone */
function human(x, yF, h, o = {}){

  P.push(Sp(`M${f1(x - .17 * u)},${f1(Y(.8))} L${f1(x + .17 * u)},${f1(Y(.8))} L${f1(x + .2 * u)},${f1(shY + .1 * u)} L${f1(x - .2 * u)},${f1(shY + .1 * u)} Z`, skin, 1));
  P.push(Sp(tor, tone));
  if (o.dress) P.push(Sp(`M${f1(x - sw * .78)},${f1(waistY)} L${f1(x + sw * .78)},${f1(waistY)} L${f1(x + sw * 1.18)},${f1(Y(ch ? 4.1 : 5.4))} L${f1(x - sw * 1.18)},${f1(Y(ch ? 4.1 : 5.4))} Z`, o.dressC || tone));

function autoVB(m, keys, pad=0.3, aspect=4/3){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  keys.forEach(k=>{const sp=m.spots[k]; if(!sp) return;
    const b = sp[0]==="c" ? [sp[1]-sp[3],sp[2]-sp[3],sp[1]+sp[3],sp[2]+sp[3]] : [sp[1],sp[2],sp[1]+sp[3],sp[2]+sp[4]];
    x0=Math.min(x0,b[0]); y0=Math.min(y0,b[1]); x1=Math.max(x1,b[2]); y1=Math.max(y1,b[3]);});
  if (x0>x1) return [0,0,m.w,m.h];
  let w=x1-x0, h=y1-y0, e=pad*Math.max(w,h); x0-=e; y0-=e; w+=2*e; h+=2*e;
  if (w/h < aspect){ const nw=h*aspect; x0-=(nw-w)/2; w=nw; } else { const nh=w/aspect; y0-=(nh-h)/2; h=nh; }
  if (w>m.w){ const k=m.w/w; w=m.w; h*=k; } if (h>m.h){ const k=m.h/h; h=m.h; w*=k; }
  x0=Math.min(Math.max(x0,0),m.w-w); y0=Math.min(Math.max(y0,0),m.h-h);
  return [x0,y0,w,h].map(v=>Math.round(v));
}

    r.tips.push("Окно сбоку, белый лист напротив как отражатель, фон — ватман изгибом.");
    r.tips.push("Цвет «не тот»? БАЛАНС БЕЛОГО → пользовательский, замер по белому листу.");
    break;
  case "docs":
    r.ap={v:"8",text:"f/5,6–f/8"}; r.zoom="35–55 мм"; r.iso="АВТО1"; r.comp="+2/3…+1"; r.bank="C7";
    r.why="Камера делает белую бумагу серой — плюс компенсации возвращает белый.";
    r.tips.push("Камера строго параллельно листу, электронный уровень на экране. Без вспышки — будет блик.");
    break;
  case "bw":
    r.ap={v:"5.6",text:"по сюжету"}; r.iso="АВТО1"; r.bank="C6"; r.face=true;
    r.why="Набор C6 включает ACROS: экран сразу показывает ч/б, удобно оценивать свет и тени.";
    r.tips.push("Ищите боковой и контровой свет, силуэты, фактуры. ЭФФЕКТ ЗЕРНИСТОСТИ «слабый» даёт плёночный вид.");
    r.tips.push("КОР. Ч И Б (Тепл/Хол) в наборе C6 оставьте 0 — чистый нейтральный ч/б. Хочется «старую фотографию» — +2…+4 (тёплый), холодный зимний тон — −2…−3.");
    r.tips.push("Снимайте с КАЧЕСТВО ИЗОБР. → F+RAW: в RAW останется цвет.");
    break;
  case "stars":
    r.mode="M"; r.shutter={dial:"T", text:"T, задний диск 15″–20″"}; r.ap={v:"2.8", text:"f/2,8 на 18 мм"}; r.zoom="18 мм";
    r.iso="3200"; r.isoFixed=true; r.focus="M"; r.af="—"; r.timer=true; r.comp="—"; r.bank="C5"; r.extra.push(P.ois);
    r.why="Правило 500: 500 / 27 мм (18 мм в эквиваленте) ≈ 18 с. Дольше — звёзды станут чёрточками.";
    r.tips.push("Фокус вручную: увеличьте яркую звезду на экране и крутите кольцо фокуса до самой маленькой точки.");
    r.tips.push("КАЧЕСТВО ИЗОБР. → F+RAW. БАЛАНС БЕЛОГО → 3800–4200 K.");
    r.warns.push("С f/2,8 Млечный Путь будет скромным — нужна тёмная ночь в 30+ км от города. ISO можно поднять до 6400.");
    if (!tripod) r.block="Без штатива звёзды не получатся: нужно 15–20 секунд полной неподвижности.";
    break;
  }
  if (W.id==="golden") {
    r.extra.push(P.wbSun);
    r.tips.push("Золотой час: баланс белого АВТО «гасит» тёплый свет заката. Q → БАЛАНС БЕЛОГО → ☀ — и золото останется. После заката верните АВТО.");
    if (["portrait","kids","family","party","street"].includes(S.what)) r.tips.push("Поставьте человека спиной или боком к низкому солнцу — вокруг волос появится светящийся контур. Лицо выходит тёмным — диск компенсации на +1/3…+2/3.");
    if (["land","water"].includes(S.what)) r.tips.push("Снимаете прямо на солнце — диск компенсации на −1/3…−2/3, чтобы небо не выгорело. Солнце за спиной — цвета мягче и ровнее.");
  }
  if (W.id==="studio" && S.what!=="stars") {
    r.mode="M"; r.shutter={dial:"125", text:"1/125 с"};
    r.ap = ["things","docs"].includes(S.what) ? {v:"11", text:"f/8–f/11 — резкий весь предмет"} : {v:"8", text:"f/5,6–f/8 — начните с f/8"};
    r.iso="160"; r.isoFixed=true; r.comp="—"; r.drive="S"; r.timer=false;
    if (S.what!=="motion" && S.what!=="kids" && S.what!=="pets") r.focus="S";
    r.extra.push(P.mech, P.preview, P.wbSun);
    r.why="В студии экспозицию задают вспышки, а не камера: выдержка, диафрагма и ISO стоят вручную, светлее или темнее — мощностью вспышек.";
    r.tips.unshift("Синхронизатор (радиопередатчик) — на башмак камеры сверху. Встроенную вспышку не поднимайте.");
    r.tips.push("Первый кадр — тестовый. Темно — прибавьте мощность вспышек или откройте диафрагму до f/5,6. Светло — наоборот. ISO не трогайте.");
    r.tips.push("Баланс белого — ☀ (СОЛНЕЧНЫЙ СВЕТ): студийные вспышки дают дневной свет, и цвет будет одинаковым от кадра к кадру.");
    r.tips.push("Если в студии постоянный свет (LED-панели), а не вспышки — выберите «Вечер, свет ламп»: там подойдут обычные советы.");
    r.warns.push("Выдержка не короче 1/180 с (на диске — не больше 125). На 250 и быстрее по кадру пойдёт чёрная полоса. Электронный затвор со вспышками не работает — только МЕХАНИЧЕСКИЙ.");
    r.warns.push("Без пункта ПРОСМОТР ЭКСП./БАЛ.БЕЛ. → ОТКЛ экран в режиме M будет почти чёрным: камера показывает кадр без вспышек. Пункт в разделе НАСТРОЙКА ЭКРАНА, название может быть сокращено иначе.");
  }
  if (r.shutter.dial==="A" && !r.isoFixed && L===0) r.warns.push("Ночью следите за выдержкой на экране: длиннее 1/30 с с рук — смаз даже с OIS.");
  if (["land","water"].includes(S.what) && (L===3 || (L===0 && tripod)) || (S.what==="street" && L===3))
    r.tips.push(`Очень контрастный свет: светлое небо или фонари и тёмные тени. Если хотите, чтобы камера сама смягчила контраст, в наборе ${r.bank} поставьте ПРИОРИТЕТ ДД → СЛАБЫЙ (MENU/OK → I.Q. → РЕД/СОХР.ПОЛ.НАСТР). Тогда ТОН СВЕТОВ, ТОН ТЕНЕЙ и ДД этого набора перестанут действовать.`);
  if (ind && L<=1 && S.what!=="stars") r.warns.push("Под лампами — механический затвор, иначе полосы: ТИП ЗАТВОРА → МЕХАНИЧЕСКИЙ.");
  return r;
}

function path(parts){ return `<span class="path">${parts.map(esc).join('<em>→</em>')}</span>`; }
const apLabel = v => v==="A" ? "A" : "f/"+v.replace(".",",");

function renderTool(){
  const whereEl=document.getElementById("where"), whatEl=document.getElementById("what");
  const cur = WHERE.find(w=>w.id===S.where);
  if (!S.place) S.place = cur && cur.indoor ? "in" : "out";
  if (!cur || !!cur.indoor !== (S.place==="in")) S.where = S.place==="in" ? "lamps" : "shade";
  if (S.what==="stars" && S.where!=="night") S.what="land";
  document.querySelectorAll("#place button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===S.place)));
  whereEl.innerHTML = WHERE.filter(w=>!!w.indoor===(S.place==="in")).map(w=>`<button type="button" class="chip" id="w-${w.id}" data-k="where" data-v="${w.id}" aria-pressed="${S.where===w.id}">${esc(w.l)}</button>`).join("");
  whatEl.innerHTML = WHAT.map(w=>{ const dis = w.onlyNight && S.where!=="night";
    return `<button type="button" class="chip" id="t-${w.id}" data-k="what" data-v="${w.id}" aria-pressed="${S.what===w.id}" ${dis?'disabled title="Только на улице ночью"':''}>${esc(w.t)}</button>`; }).join("");
  document.querySelectorAll("#tripod button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===S.tripod)));

  const r = advise(), W = WHERE.find(w=>w.id===S.where), T = WHAT.find(w=>w.id===S.what);
  const modeName = {A:"Приоритет диафрагмы", S:"Приоритет выдержки", M:"Ручной режим"}[r.mode];
  const el = document.getElementById("result");
  if (r.block) {
    el.innerHTML = `<div class="card"><div class="head"><div class="mode">!</div><div><div class="where">${esc(W.t)}</div><h2>${esc(T.t)}</h2><p>Сначала нужен штатив</p></div></div></div>
      <div class="note block"><b>Без штатива не выйдет.</b> ${esc(r.block)} Выберите «Есть штатив».</div>`;
    return;
  }
  const rot = [];
  rot.push("<b>Рычаг AUTO</b> (под диском выдержки) — отведите от AUTO.");
  rot.push(`<b>Диск выдержки → ${esc(r.shutter.dial)}</b>${r.shutter.dial==="A"?" (выдержку выберет камера)":` (${esc(r.shutter.text)})`}.`);
  if (r.zoom) rot.push(`<b>Кольцо зума → ${esc(r.zoom)}.</b>`);
  rot.push(r.ap.v==="A" ? "<b>Переключатель на объективе → A.</b> Диафрагму выберет камера."
    : (r.ap.v==="2.8")
      ? `<b>Переключатель на объективе → значок диафрагмы, кольцо до упора к меньшим числам</b> (${esc(r.ap.text)}). Дальше упора кольцо f не меняет — самое светлое значение задаёт зум: 18 мм — f/2,8, 23 мм — f/3,2, 55 мм — f/4. Это нормально для объектива 18–55. Если f не меняется от кольца ни в одну сторону — переключатель ещё на A.`
      : `<b>Переключатель на объективе → значок диафрагмы, кольцо → ${esc(apLabel(r.ap.v))}</b> (${esc(r.ap.text)}). Число смотрите на экране. Кольцо не меняет f — значит, переключатель ещё на A. Число меняется при зуме — это нормально: на 18 мм самое светлое f/2,8, на 55 мм только f/4.`);
  rot.push(`<b>Рычаг фокуса спереди → ${r.focus}</b> (${ {S:"AF-S, для неподвижного",C:"AF-C, ведёт движение",M:"ручной фокус"}[r.focus]}).`);
  rot.push(`<b>Диск DRIVE → ${r.drive}</b>${r.drive==="S"?" (один кадр)":r.drive==="CL"?" (серия до 5 к/с)":" (серия 8 к/с)"}.`);
  if (r.comp && r.comp!=="0" && r.comp!=="—") rot.push(`<b>Диск компенсации → ${esc(r.comp)}</b> (справа на верхней панели)${r.compWhy?", "+esc(r.compWhy):""}. Одна риска — 1/3 ступени: к минусу темнее, к плюсу светлее.`);
  if (r.compLater) rot.push(`<b>Диск компенсации → 0.</b> ${esc(r.compLater.when)} — поверните его на <b>${esc(r.compLater.v)}</b> (к ${esc(r.compLater.to)}; одна риска — 1/3 ступени)${r.compLater.back?", а потом верните на 0":""}.`);

  const oisOff = r.extra.includes(P.ois);
  if (oisOff) rot.push("<b>Переключатель OIS на объективе → OFF</b> — на штативе стабилизатор мешает.");
  const comp = r.comp && !r.comp.startsWith("0") && r.comp!=="—";
  const compNote = r.comp && r.comp!=="0" && r.comp!=="—";
  const menu = [P.bank(BANKS[r.bank]), P.iso(r.iso)];
  if (r.focus!=="M") menu.push(P.afmode(r.af));
  menu.push(P.face(r.face));
  r.extra.filter(e=>e!==P.ois).forEach(e=>menu.push(e));
  if (r.timer) menu.push(P.timer);

  const summary = [r.mode, r.shutter.dial==="A"?"выдержка авто":r.shutter.text, r.ap.v==="A"?"диафрагма авто":apLabel(r.ap.v)]
    .concat(r.zoom?[r.zoom]:[]).concat(["ISO "+r.iso, {S:"AF-S",C:"AF-C",M:"MF"}[r.focus]])
    .concat(r.drive!=="S"?[r.drive]:[]).concat(r.face?["ГЛАЗ АВТО"]:[]).concat(r.timer?["таймер 2 с"]:[]).concat([r.bank]);

  el.innerHTML = `
  <div class="card">
    <div class="head"><div class="mode">${r.mode}</div>
      <div><div class="where">${esc(W.t)}</div><h2>${esc(T.t)}</h2><p>${esc(modeName)}. ${esc(r.why)}</p></div></div>
    <div class="summary">${summary.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
  </div>
  <div class="gauges">
    <div class="g"><div class="lab">Диск выдержки</div>${photo("top",["shutter_dial","auto","expcomp"],[
        {k:"shutter_dial",color:RED,label:"→ "+r.shutter.dial,arc:true},
        {k:"auto",color:RED,label:"не AUTO"}].concat(comp?[{k:"expcomp",color:YEL,ink:"#1D1F22",label:"комп. "+r.comp.split(" ")[0]}]:[]),{alt:"Диск выдержки",pad:.1})}
      <div class="val">${esc(r.shutter.dial)}</div><div class="sub">${esc(r.shutter.text)}${compNote?" · компенсация "+esc(r.comp):""}${r.compLater?" · компенсация 0":""}</div></div>
    <div class="g"><div class="lab">Объектив 18–55</div>${photo("lens",null,[
        {k:"a_switch",color:RED,label:r.ap.v==="A"?"→ A":"→ ◎",fs:6.5}]
        .concat(r.ap.v!=="A"?[{k:"aperture_ring",color:RED,label:"кольцо → "+apLabel(r.ap.v)}]:[])
        .concat(r.zoom?[{k:"zoom",color:RED,label:"зум → "+r.zoom,at:"top"}]:[])
        .concat(oisOff?[{k:"ois",color:YEL,ink:"#1D1F22",label:"OFF",fs:6.5}]:[]),{alt:"Объектив"})}
      <div class="val">${esc(apLabel(r.ap.v))}${r.zoom?" · "+esc(r.zoom):""}</div><div class="sub">${esc(r.ap.text)}</div></div>
    <div class="g"><div class="lab">Рычаг фокуса</div>${photo("front",["focus_sel"],[{k:"focus_sel",color:RED,label:"→ "+r.focus}],{alt:"Рычаг фокуса",state:{focus:r.focus},pad:.9})}
      <div class="val">${r.focus}</div><div class="sub">${esc(r.focus==="M"?"вручную":"РЕЖИМ АФ: "+r.af)}</div></div>
    <div class="g"><div class="lab">Диск DRIVE</div>${photo("top",["drive","flash"],[{k:"drive",color:RED,label:"→ "+r.drive,arc:true}],{alt:"Диск DRIVE",pad:.25})}
      <div class="val">${r.drive}</div><div class="sub">ISO ${esc(r.iso)}</div></div>
  </div>
  <div class="twocol">
    <div class="card"><h3><i style="background:var(--rot)"></i>Повернуть на камере</h3><ol class="steps">${rot.map(s=>`<li class="r"><div>${s}</div></li>`).join("")}</ol></div>
    <div class="card"><h3><i style="background:var(--press)"></i>Выбрать в меню</h3><ol class="steps">${menu.map(m=>`<li class="p"><div>${path(m)}</div></li>`).join("")}</ol>
      <div class="menuph">${photo("rear",["q","menu","stick","disp"],[{k:"q",color:BLUE,num:1},{k:"menu",color:BLUE,num:2},{k:"stick",color:BLUE,num:3},{k:"disp",color:BLUE,num:4}],{alt:"Кнопки меню",pad:.35,aspect:3/4})}</div><p class="hint" style="margin-top:6px">1 — Q, 2 — MENU/OK, 3 — джойстик: листать и выбирать, 4 — DISP/BACK: назад.</p><p class="hint" style="margin-top:8px">Набор ${esc(r.bank)} включает плёнку и тона картинки — создайте его один раз на вкладке «Наборы C1–C7».</p></div>
  </div>
  ${shotBlock(S.what, W)}
  ${(r.tips.length||r.warns.length)?`<div class="card notes"><h3><i style="background:var(--ok)"></i>Подсказки</h3>
    ${r.tips.map(t=>`<div class="note tip"><b>Совет.</b> ${esc(t)}</div>`).join("")}
    ${r.warns.map(t=>`<div class="note warn"><b>Внимание.</b> ${esc(t)}</div>`).join("")}</div>`:""}`;
}

const f1 = n => +n.toFixed(1);

/* A drawn shape group: paper halo (separates overlapping figures) + tone + pencil hatching */
function fig(parts, tone, o = {}){
  const hw = o.hw ?? 3, hat = o.hatch ?? "url(#pzh)";
  const one = (p, pass) => {
    const c = pass === 0 ? PAPER : pass === 1 ? (p.c || tone) : hat;
    if (p.l) return `<polyline points="${pts(p.l)}" fill="none" stroke="${c}" stroke-width="${p.w + (pass === 0 ? hw : 0)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    return p.s.replace("/>", pass === 0 ? ` fill="${PAPER}" stroke="${PAPER}" stroke-width="${hw}" stroke-linejoin="round"/>` : ` fill="${c}"/>`);
  };
  const halo = o.halo === false ? "" : parts.map(p => one(p, 0)).join("");
  const body = parts.map(p => one(p, 1)).join("");
  const h = hat === "none" ? "" : parts.filter(p => !p.nh).map(p => one(p, 2)).join("");
  return `<g filter="url(#pzW)"${o.op ? ` opacity="${o.op}"` : ""}>${halo}${body}${h}</g>`;
}
const Sp = (d, c, nh) => ({ s: `<path d="${d}"/>`, c, nh });
const E = (cx, cy, rx, ry, c, nh) => ({ s: `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}"/>`, c, nh });
const Lm = (l, w, c) => ({ l, w, c });

/* Human figure. o: kind adult|child, fem, hair short|long|bun, dress, pose stand|walk|sit, arms down|front|reach, tone */
function human(x, yF, h, o = {}){
  const ch = o.kind === "child", u = h / (ch ? 5.6 : 7.4);
  const sit = o.pose === "sit", walk = o.pose === "walk";
  const hipK = ch ? 2.95 : 3.85;
  const top = sit ? yF - .4 * u - hipK * u : yF - h;
  const Y = k => top + k * u;
  const tone = o.tone || TN[4], skin = o.skin || (o.shade ? "url(#pzFace)" : TN[1]), hairC = o.hairC || TN[6];
  const sw = (ch ? .8 : (o.fem ? .86 : 1.03)) * u * (walk ? .55 : 1);
  const shY = Y(ch ? 1.25 : 1.36), waistY = Y(ch ? 2.45 : 2.9), hipY = Y(hipK);
  const P = [];
  const lw = (ch ? .52 : .5) * u, hx = .31 * u;
  const legC = o.legs || (o.dress ? skin : TN[5]);
  // legs
  if (sit){
    [-1, 1].forEach(s => { const kx = x + s * 1.2 * u, fx = x - s * .35 * u;
      P.push(Lm([[x + s * hx, hipY], [kx, yF - .3 * u], [fx, yF - .2 * u]], lw, legC), E(fx - s * .15 * u, yF - .15 * u, .3 * u, .15 * u, TN[6])); });
  } else if (walk){
    P.push(Lm([[x, hipY], [x - .22 * u, Y(5.6)], [x - .75 * u, yF - .12 * u]], lw, TN[5]), E(x - .72 * u, yF - .07 * u, .3 * u, .12 * u, TN[6]));
    P.push(Lm([[x, hipY], [x + .45 * u, Y(5.6)], [x + .7 * u, yF - .12 * u]], lw, legC), E(x + .85 * u, yF - .07 * u, .32 * u, .12 * u, TN[6]));
  } else {
    [-1, 1].forEach(s => { P.push(Lm([[x + s * hx, hipY], [x + s * hx * 1.05, (hipY + yF) / 2], [x + s * hx * 1.12, yF - .14 * u]], lw, legC),
      E(x + s * hx * 1.25, yF - .08 * u, .3 * u, .13 * u, TN[6])); });
  }
  // long hair behind the head
  const hxo = x + (o.turn || 0) * u;
  if (o.hair === "long") P.push(Sp(`M${f1(hxo - .5 * u)},${f1(Y(1.75))} Q${f1(hxo - .62 * u)},${f1(Y(-.06))} ${f1(hxo)},${f1(Y(-.06))} Q${f1(hxo + .62 * u)},${f1(Y(-.06))} ${f1(hxo + .5 * u)},${f1(Y(1.75))} Z`, hairC));
  // torso (+ dress)
  const tor = `M${f1(x - sw)},${f1(shY + .28 * u)} Q${f1(x - sw)},${f1(shY)} ${f1(x - sw + .32 * u)},${f1(shY - .07 * u)} L${f1(x + sw - .32 * u)},${f1(shY - .07 * u)} Q${f1(x + sw)},${f1(shY)} ${f1(x + sw)},${f1(shY + .28 * u)} L${f1(x + sw * .8)},${f1(waistY)} L${f1(x + sw * .84)},${f1(hipY + .15 * u)} L${f1(x - sw * .84)},${f1(hipY + .15 * u)} L${f1(x - sw * .8)},${f1(waistY)} Z`;
  P.push(Sp(`M${f1(x - .17 * u)},${f1(Y(.8))} L${f1(x + .17 * u)},${f1(Y(.8))} L${f1(x + .2 * u)},${f1(shY + .1 * u)} L${f1(x - .2 * u)},${f1(shY + .1 * u)} Z`, skin, 1));
  P.push(Sp(tor, tone));
  if (o.dress) P.push(Sp(`M${f1(x - sw * .78)},${f1(waistY)} L${f1(x + sw * .78)},${f1(waistY)} L${f1(x + sw * 1.18)},${f1(Y(ch ? 4.1 : 5.4))} L${f1(x - sw * 1.18)},${f1(Y(ch ? 4.1 : 5.4))} Z`, o.dressC || tone));
  // arms
  const aw = (ch ? .36 : .33) * u, armC = o.armC || tone;
  const hand = (hx_, hy_) => E(hx_, hy_, .16 * u, .19 * u, skin, 1);
  [-1, 1].forEach(s => {
    const sx = x + s * (sw - .17 * u), sy = shY + .22 * u;
    let a;
    if (o.arms === "front") a = [[sx, sy], [x + s * (sw + .05 * u), Y(ch ? 2.2 : 2.7)], [x + s * .35 * u, Y(ch ? 2.6 : 3.3)]];
    else if (o.arms === "reach" && s === 1) a = [[sx, sy], [x + sw + .5 * u, Y(ch ? 1.95 : 2.4)], [x + sw + 1.25 * u, Y(ch ? 2.25 : 2.8)]];
    else if (walk) a = s < 0 ? [[x, sy], [x - .3 * u, Y(2.4)], [x - .5 * u, Y(3.3)]] : [[x, sy], [x + .25 * u, Y(2.45)], [x + .6 * u, Y(3.2)]];
    else a = [[sx, sy], [x + s * (sw + .03 * u), Y(ch ? 2.25 : 2.75)], [x + s * (sw - .05 * u), Y(ch ? 3.05 : 3.8)]];
    P.push(Lm(a, aw, armC), hand(a[2][0], a[2][1] + .08 * u));
  });
  // head
  const hr = (ch ? .44 : .4) * u, hry = (ch ? .5 : .52) * u;
  P.push(E(hxo, Y(.53), hr, hry, skin, 1));
  // hair cap
  if (o.hair !== "none"){
    const cap = `M${f1(hxo - hr * 1.07)},${f1(Y(.62))} Q${f1(hxo - hr * 1.15)},${f1(Y(-.03))} ${f1(hxo)},${f1(Y(-.03))} Q${f1(hxo + hr * 1.15)},${f1(Y(-.03))} ${f1(hxo + hr * 1.07)},${f1(Y(.62))} Q${f1(hxo + hr * .7)},${f1(Y(.24))} ${f1(hxo + .05 * u)},${f1(Y(.26))} Q${f1(hxo - hr * .7)},${f1(Y(.2))} ${f1(hxo - hr * 1.07)},${f1(Y(.62))} Z`;
    P.push(Sp(cap, hairC));
    if (o.hair === "bun") P.push(E(hxo, Y(-.12), .24 * u, .2 * u, hairC));
  }
  return fig(P, tone, o);
}

/* Scenery helpers */
const band = (pp, c, extra = "") => `<path d="M${pts(pp)} Z" fill="${c}" ${extra}/>`;
function ridge(x0, x1, yBase, amp, n, s, bottom = SH){

    r.tips.push("Three quick changes during the evening. Cake candles: compensation dial to −2/3 (two clicks toward minus), no flash — the shot stays dark and warm like the room, not gray. Group photo at the table: f/4, step back 3 m, burst. Dancing: Q → ISO → AUTO2 (1/250 or faster), then back to AUTO1.");
    r.tips.push("Keep faces close to the lamps, with a dark wall behind — not a window.");
    if (L<=1) r.warns.push("The built-in flash hits straight on and kills the mood — use it only when it's really dark, and then with SLOW SYNC and power −1.");
    if (!ind) r.tips.push("Party outdoors: see the light tips above — pick the location, the settings stay the same.");
    break;
  case "pets":
    r.ap={v:"2.8", text:"smallest number"}; r.iso="AUTO2"; r.focus="C"; r.drive="CL"; r.bank="C2";
    r.why="X-T30 eye detection only works on people — catch the animal's eye yourself with a small focus point.";
    r.tips.push("Use the joystick to put the point on the nearer eye, and the rear dial to make it smaller.");
    r.tips.push("For shy animals, go silent: SHUTTER TYPE → ELECTRONIC SHUTTER (but not under flickering lights).");
    if (L<=1) r.warns.push("No flash: it scares them and gives glowing eyes. Move closer to the light.");
    break;
  case "motion": {
    r.mode="S"; const sp = L===3?"1000":L===2?"500":"250";
    r.shutter={dial:sp, text:`1/${sp} s`}; r.ap={v:"A", text:"switch to A"};
    r.iso="AUTO2"; r.focus="C"; r.af="ZONE"; r.drive="CH"; r.bank="C2";
    r.extra.push(P.afc("SET 3"));
    r.why="You set a fast shutter speed, the camera picks aperture and ISO. CH gives 8 fps without distortion.";
    r.tips.push("Half-press the shutter button in advance and follow the subject with the zone.");
    if (L<=1) r.warns.push("Not enough light for fast motion: 1/250 s will blur a bike. Catch a pause in the action or find more light.");
    if (L===3) r.tips.push("Still blurry? Set 2000 (1/2000 s).");
    break; }
  case "street":
    r.ap={v:"8", text:"f/5.6–f/8"}; r.zoom="18–23 mm"; r.iso="AUTO2"; r.af="ZONE"; r.bank="C3";
    r.why="At 18 mm and f/8, almost everything from 1.5 m to the horizon is sharp — you barely need to focus.";
    if (L<=1) { r.ap={v:"2.8",text:"f/2.8 at 18 mm"}; r.iso="AUTO1"; r.comp="−1/3…−2/3"; r.why="In the evening, open the aperture at 18 mm and keep the dark evening look with minus compensation."; }
    r.tips.push("Tilt the screen and shoot from waist level — people notice the camera less.");
    break;
  case "land":
    r.face=false; r.ap={v:"8", text:"f/8"}; r.zoom="18 mm"; r.bank="C4";
    r.why="f/8 is the sharpest aperture: sharp from foreground to horizon.";
    if (L>=2) { r.iso="AUTO3"; r.comp = L===3 ? "−1/3" : "0"; if (L===3) r.compWhy="so the bright sky doesn't blow out"; r.tips.push("Add a foreground: a rock, a road, a branch. Level the horizon with the electronic level."); }
    else if (tripod) {
      r.mode="M"; r.shutter={dial:"T", text: L===0?"T, rear dial 4″–15″":"T, rear dial 1″–4″"};
      r.iso="160"; r.isoFixed=true; r.timer=true; r.comp="—"; r.bank="C5";
      r.extra.push(P.ois);
      r.why="On a tripod: low ISO and a long exposure give a clean, detailed image.";
      r.warns.push("Watch the histogram: streetlights shouldn't hit the right edge. If overexposed, use a shorter exposure.");
    } else {
      r.ap={v:"2.8", text:"f/2.8 at 18 mm"}; r.iso="AUTO3"; r.comp="−2/3";
      r.why="Without a tripod, open the aperture at 18 mm; the lens stabilizer will handle 1/30 s.";
      r.warns.push("The X-T30 body has no stabilizer, only the lens OIS works. Brace against a wall and shoot a burst of 3 frames.");
    }
    break;
  case "water":
    if (tripod && L<=2) {
      r.mode="S"; r.shutter={dial:"2", text:"1/2 s (up to 2″ via T)"}; r.ap={v:"A",text:"A — stops down to f/11–16"};
      r.iso="160"; r.isoFixed=true; r.timer=true; r.bank="C4"; r.extra.push(P.ois);
      r.why="A long exposure turns water into \"silk\" while rocks stay sharp — tripod only.";
      r.tips.push("Focus on a rock, then set the focus lever to M so focus doesn't shift.");
      if (L===2) r.tips.push("Too bright even at f/16? You need a 58 mm ND filter (ND8–ND64) — that's the 18–55's filter size.");
    } else {
      r.mode="S"; const sp = L===3?"1000":L===2?"500":"250";
      r.shutter={dial:sp,text:`1/${sp} s`}; r.ap={v:"A",text:"switch to A"}; r.iso="AUTO2"; r.focus="C"; r.af="ZONE"; r.drive="CL"; r.bank="C4";
      r.why="A fast shutter speed \"freezes\" the spray, and a burst catches the wave's peak.";
      if (tripod && L===3) r.tips.push("\"Silky\" water in sunlight needs a 58 mm ND filter.");
    }
    r.warns.push("The X-T30 and 18–55 aren't weather-sealed: in rain or spray use a cover or a bag, and bring a lens cloth.");
    break;
  case "things":
    r.ap={v:"5.6",text:"f/5.6–f/8"}; r.zoom="55 mm"; r.bank="C7";
    r.why="55 mm doesn't distort shapes, and f/5.6–8 keeps the whole object sharp. The 18–55 can't focus closer than ~30 cm.";
    if (tripod) { r.iso="160"; r.isoFixed=true; r.timer=true; r.extra.push(P.ois); } else r.iso="AUTO1";
    r.tips.push("Window to the side, white sheet opposite as a reflector, and a curved sheet of white paper as the background.");
    r.tips.push("Colors look off? WHITE BALANCE → CUSTOM, measure off a white sheet.");
    break;
  case "docs":
    r.ap={v:"8",text:"f/5.6–f/8"}; r.zoom="35–55 mm"; r.iso="AUTO1"; r.comp="+2/3…+1"; r.bank="C7";
    r.why="The camera makes white paper look gray — plus compensation brings the white back.";
    r.tips.push("Keep the camera exactly parallel to the page, with the electronic level on screen. No flash — it causes glare.");
    break;
  case "bw":
    r.ap={v:"5.6",text:"depends on subject"}; r.iso="AUTO1"; r.bank="C6"; r.face=true;
    r.why="Bank C6 turns on ACROS: the screen shows B&W right away, so it's easy to judge light and shadow.";
    r.tips.push("Look for side light and backlight, silhouettes, textures. GRAIN EFFECT WEAK gives a film look.");
    r.tips.push("Leave MONOCHROMATIC COLOR (WARM/COOL) in bank C6 at 0 for clean neutral B&W. For an \"old photo\" look, +2…+4 (warm); for a cold winter tone, −2…−3.");
    r.tips.push("Shoot with IMAGE QUALITY → F+RAW: the RAW file keeps the color.");
    break;
  case "stars":
    r.mode="M"; r.shutter={dial:"T", text:"T, rear dial 15″–20″"}; r.ap={v:"2.8", text:"f/2.8 at 18 mm"}; r.zoom="18 mm";
    r.iso="3200"; r.isoFixed=true; r.focus="M"; r.af="—"; r.timer=true; r.comp="—"; r.bank="C5"; r.extra.push(P.ois);
    r.why="500 rule: 500 / 27 mm (18 mm equivalent) ≈ 18 s. Any longer and stars turn into streaks.";
    r.tips.push("Focus manually: zoom in on a bright star on screen and turn the focus ring until it's the smallest dot.");
    r.tips.push("IMAGE QUALITY → F+RAW. WHITE BALANCE → 3800–4200 K.");
    r.warns.push("At f/2.8 the Milky Way will be faint — you need a dark night 30+ km from the city. ISO can go up to 6400.");
    if (!tripod) r.block="Stars won't work without a tripod: you need 15–20 seconds of complete stillness.";
    break;
  }
  if (W.id==="golden") {
    r.extra.push(P.wbSun);
    r.tips.push("Golden hour: AUTO white balance \"cancels\" the warm sunset light. Q → WHITE BALANCE → ☀ and the gold stays. Switch back to AUTO after sunset.");
    if (["portrait","kids","family","party","street"].includes(S.what)) r.tips.push("Put the person with their back or side to the low sun for a glowing rim around the hair. If the face comes out dark, set the compensation dial to +1/3…+2/3.");
    if (["land","water"].includes(S.what)) r.tips.push("Shooting into the sun? Set the compensation dial to −1/3…−2/3 so the sky doesn't blow out. Sun behind you gives softer, more even colors.");
  }
  if (W.id==="studio" && S.what!=="stars") {
    r.mode="M"; r.shutter={dial:"125", text:"1/125 s"};
    r.ap = ["things","docs"].includes(S.what) ? {v:"11", text:"f/8–f/11 — whole object sharp"} : {v:"8", text:"f/5.6–f/8 — start at f/8"};
    r.iso="160"; r.isoFixed=true; r.comp="—"; r.drive="S"; r.timer=false;
    if (S.what!=="motion" && S.what!=="kids" && S.what!=="pets") r.focus="S";
    r.extra.push(P.mech, P.preview, P.wbSun);
    r.why="In a studio the flashes set the exposure, not the camera: shutter, aperture and ISO are set manually, and you make it brighter or darker with flash power.";
    r.tips.unshift("Put the trigger (radio transmitter) in the hot shoe on top. Don't pop up the built-in flash.");
    r.tips.push("The first shot is a test. Too dark: raise flash power or open up to f/5.6. Too bright: the opposite. Don't touch ISO.");
    r.tips.push("White balance: ☀ (DAYLIGHT). Studio flashes give daylight-balanced light, so color stays the same from shot to shot.");
    r.tips.push("If the studio has continuous light (LED panels) instead of flashes, choose \"Evening, lamp light\": the regular tips apply there.");
    r.warns.push("Shutter no faster than 1/180 s (125 max on the dial). At 250 and faster a black band appears across the frame. The electronic shutter doesn't work with flashes — MECHANICAL SHUTTER only.");
    r.warns.push("Without PREVIEW EXP./WB IN MANUAL MODE → OFF, the screen in M mode will be almost black: the camera shows the shot without flashes. The item is in SCREEN SET-UP; its name may be abbreviated differently.");
  }
  if (r.shutter.dial==="A" && !r.isoFixed && L===0) r.warns.push("At night, watch the shutter speed on screen: handheld slower than 1/30 s means blur, even with OIS.");
  if (["land","water"].includes(S.what) && (L===3 || (L===0 && tripod)) || (S.what==="street" && L===3))
    r.tips.push(`Very contrasty light: bright sky or streetlights and dark shadows. To let the camera soften the contrast, set D RANGE PRIORITY → WEAK in bank ${r.bank} (MENU/OK → I.Q. → EDIT/SAVE CUSTOM SETTING). Then that bank's HIGHLIGHT TONE, SHADOW TONE and DR stop having an effect.`);
  if (ind && L<=1 && S.what!=="stars") r.warns.push("Under lamps, use the mechanical shutter or you'll get banding: SHUTTER TYPE → MECHANICAL SHUTTER.");
  return r;
}

function path(parts){ return `<span class="path">${parts.map(esc).join('<em>→</em>')}</span>`; }
const apLabel = v => v==="A" ? "A" : "f/"+v;

function renderTool(){
  const whereEl=document.getElementById("where"), whatEl=document.getElementById("what");
  const cur = WHERE.find(w=>w.id===S.where);
  if (!S.place) S.place = cur && cur.indoor ? "in" : "out";
  if (!cur || !!cur.indoor !== (S.place==="in")) S.where = S.place==="in" ? "lamps" : "shade";
  if (S.what==="stars" && S.where!=="night") S.what="land";
  document.querySelectorAll("#place button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===S.place)));
  whereEl.innerHTML = WHERE.filter(w=>!!w.indoor===(S.place==="in")).map(w=>`<button type="button" class="chip" id="w-${w.id}" data-k="where" data-v="${w.id}" aria-pressed="${S.where===w.id}">${esc(w.l)}</button>`).join("");
  whatEl.innerHTML = WHAT.map(w=>{ const dis = w.onlyNight && S.where!=="night";
    return `<button type="button" class="chip" id="t-${w.id}" data-k="what" data-v="${w.id}" aria-pressed="${S.what===w.id}" ${dis?'disabled title="Outdoors at night only"':''}>${esc(w.t)}</button>`; }).join("");
  document.querySelectorAll("#tripod button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===S.tripod)));

  const r = advise(), W = WHERE.find(w=>w.id===S.where), T = WHAT.find(w=>w.id===S.what);
  const modeName = {A:"Aperture priority", S:"Shutter priority", M:"Manual mode"}[r.mode];
  const el = document.getElementById("result");
  if (r.block) {
    el.innerHTML = `<div class="card"><div class="head"><div class="mode">!</div><div><div class="where">${esc(W.t)}</div><h2>${esc(T.t)}</h2><p>You need a tripod first</p></div></div></div>
      <div class="note block"><b>This won't work without a tripod.</b> ${esc(r.block)} Choose "I have a tripod".</div>`;
    return;
  }
  const rot = [];
  rot.push("<b>AUTO lever</b> (under the shutter speed dial) — move it off AUTO.");
  rot.push(`<b>Shutter speed dial → ${esc(r.shutter.dial)}</b>${r.shutter.dial==="A"?" (the camera picks the shutter speed)":` (${esc(r.shutter.text)})`}.`);
  if (r.zoom) rot.push(`<b>Zoom ring → ${esc(r.zoom)}.</b>`);
  rot.push(r.ap.v==="A" ? "<b>Lens switch → A.</b> The camera picks the aperture."
    : (r.ap.v==="2.8")
      ? `<b>Lens switch → aperture icon, turn the ring all the way to the smallest numbers</b> (${esc(r.ap.text)}). Past that stop the ring won't change f — the brightest value depends on the zoom: 18 mm — f/2.8, 23 mm — f/3.2, 55 mm — f/4. That's normal for the 18–55 lens. If the ring doesn't change f in either direction, the switch is still on A.`
      : `<b>Lens switch → aperture icon, ring → ${esc(apLabel(r.ap.v))}</b> (${esc(r.ap.text)}). Check the number on the screen. If the ring doesn't change f, the switch is still on A. The number changes as you zoom — that's normal: at 18 mm the brightest is f/2.8, at 55 mm only f/4.`);
  rot.push(`<b>Focus lever on the front → ${r.focus}</b> (${ {S:"AF-S, for still subjects",C:"AF-C, follows movement",M:"manual focus"}[r.focus]}).`);
  rot.push(`<b>DRIVE dial → ${r.drive}</b>${r.drive==="S"?" (single frame)":r.drive==="CL"?" (burst up to 5 fps)":" (burst at 8 fps)"}.`);
  if (r.comp && r.comp!=="0" && r.comp!=="—") rot.push(`<b>Exposure compensation dial → ${esc(r.comp)}</b> (on the right of the top plate)${r.compWhy?", "+esc(r.compWhy):""}. One click is 1/3 stop: toward minus is darker, toward plus is brighter.`);
  if (r.compLater) rot.push(`<b>Exposure compensation dial → 0.</b> ${esc(r.compLater.when)} — turn it to <b>${esc(r.compLater.v)}</b> (toward ${esc(r.compLater.to)}; one click is 1/3 stop)${r.compLater.back?", then set it back to 0":""}.`);

  const oisOff = r.extra.includes(P.ois);
  if (oisOff) rot.push("<b>OIS switch on the lens → OFF</b> — on a tripod the stabilizer gets in the way.");
  const comp = r.comp && !r.comp.startsWith("0") && r.comp!=="—";
  const compNote = r.comp && r.comp!=="0" && r.comp!=="—";
  const menu = [P.bank(BANKS[r.bank]), P.iso(r.iso)];
  if (r.focus!=="M") menu.push(P.afmode(r.af));
  menu.push(P.face(r.face));
  r.extra.filter(e=>e!==P.ois).forEach(e=>menu.push(e));
  if (r.timer) menu.push(P.timer);

  const summary = [r.mode, r.shutter.dial==="A"?"shutter auto":r.shutter.text, r.ap.v==="A"?"aperture auto":apLabel(r.ap.v)]
    .concat(r.zoom?[r.zoom]:[]).concat(["ISO "+r.iso, {S:"AF-S",C:"AF-C",M:"MF"}[r.focus]])
    .concat(r.drive!=="S"?[r.drive]:[]).concat(r.face?["EYE AUTO"]:[]).concat(r.timer?["2 s timer"]:[]).concat([r.bank]);

  el.innerHTML = `
  <div class="card">
    <div class="head"><div class="mode">${r.mode}</div>
      <div><div class="where">${esc(W.t)}</div><h2>${esc(T.t)}</h2><p>${esc(modeName)}. ${esc(r.why)}</p></div></div>
    <div class="summary">${summary.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
  </div>
  <div class="gauges">
    <div class="g"><div class="lab">Shutter speed dial</div>${photo("top",["shutter_dial","auto","expcomp"],[
        {k:"shutter_dial",color:RED,label:"→ "+r.shutter.dial,arc:true},
        {k:"auto",color:RED,label:"not AUTO"}].concat(comp?[{k:"expcomp",color:YEL,ink:"#1D1F22",label:"comp. "+r.comp.split(" ")[0]}]:[]),{alt:"Shutter speed dial",pad:.1})}
      <div class="val">${esc(r.shutter.dial)}</div><div class="sub">${esc(r.shutter.text)}${compNote?" · compensation "+esc(r.comp):""}${r.compLater?" · compensation 0":""}</div></div>
    <div class="g"><div class="lab">18–55 lens</div>${photo("lens",null,[
        {k:"a_switch",color:RED,label:r.ap.v==="A"?"→ A":"→ ◎",fs:6.5}]
        .concat(r.ap.v!=="A"?[{k:"aperture_ring",color:RED,label:"ring → "+apLabel(r.ap.v)}]:[])
        .concat(r.zoom?[{k:"zoom",color:RED,label:"zoom → "+r.zoom,at:"top"}]:[])
        .concat(oisOff?[{k:"ois",color:YEL,ink:"#1D1F22",label:"OFF",fs:6.5}]:[]),{alt:"Lens"})}
      <div class="val">${esc(apLabel(r.ap.v))}${r.zoom?" · "+esc(r.zoom):""}</div><div class="sub">${esc(r.ap.text)}</div></div>
    <div class="g"><div class="lab">Focus lever</div>${photo("front",["focus_sel"],[{k:"focus_sel",color:RED,label:"→ "+r.focus}],{alt:"Focus lever",state:{focus:r.focus},pad:.9})}
      <div class="val">${r.focus}</div><div class="sub">${esc(r.focus==="M"?"manual":"AF MODE: "+r.af)}</div></div>
    <div class="g"><div class="lab">DRIVE dial</div>${photo("top",["drive","flash"],[{k:"drive",color:RED,label:"→ "+r.drive,arc:true}],{alt:"DRIVE dial",pad:.25})}
      <div class="val">${r.drive}</div><div class="sub">ISO ${esc(r.iso)}</div></div>
  </div>
  <div class="twocol">
    <div class="card"><h3><i style="background:var(--rot)"></i>Turn on the camera</h3><ol class="steps">${rot.map(s=>`<li class="r"><div>${s}</div></li>`).join("")}</ol></div>
    <div class="card"><h3><i style="background:var(--press)"></i>Set in the menu</h3><ol class="steps">${menu.map(m=>`<li class="p"><div>${path(m)}</div></li>`).join("")}</ol>
      <div class="menuph">${photo("rear",["q","menu","stick","disp"],[{k:"q",color:BLUE,num:1},{k:"menu",color:BLUE,num:2},{k:"stick",color:BLUE,num:3},{k:"disp",color:BLUE,num:4}],{alt:"Menu buttons",pad:.35,aspect:3/4})}</div><p class="hint" style="margin-top:6px">1 — Q, 2 — MENU/OK, 3 — joystick: scroll and select, 4 — DISP/BACK: back.</p><p class="hint" style="margin-top:8px">Set ${esc(r.bank)} includes the film simulation and picture tones — create it once on the "C1–C7 sets" tab.</p></div>
  </div>
  ${shotBlock(S.what, W)}
  ${(r.tips.length||r.warns.length)?`<div class="card notes"><h3><i style="background:var(--ok)"></i>Tips</h3>
    ${r.tips.map(t=>`<div class="note tip"><b>Tip.</b> ${esc(t)}</div>`).join("")}
    ${r.warns.map(t=>`<div class="note warn"><b>Heads up.</b> ${esc(t)}</div>`).join("")}</div>`:""}`;
}

function setTab(t){
  S.tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===t)));
  for (const p of ["tool","map","menu","sets"]) document.getElementById("pane-"+p).hidden = p!==t;
}
function save(){ try { localStorage.setItem("xt30-pick2", JSON.stringify(S)); } catch(e) {} }

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b || b.disabled || !b.closest("#app")) return;
  if (b.dataset.tab) { setTab(b.dataset.tab); save(); return; }
  if (b.dataset.k) S[b.dataset.k]=b.dataset.v;
  else if (b.parentElement.id==="tripod") S.tripod=b.dataset.v;
  else if (b.parentElement.id==="place") S.place=b.dataset.v;
  else if (b.parentElement.id==="style") { S.style=b.dataset.v; save(); renderStyle(); renderTool(); renderMap(); return; }
  else return;
  save(); renderTool();
}, {signal: window.__AC.signal});

<script>
(function(){
  const TITLE={ru:"Подсказчик X-T30", en:"X-T30 Settings Helper"};
  function pick(){ try{ const v=localStorage.getItem("xt30-lang"); if(v==="ru"||v==="en") return v; }catch(e){}
    return /^(ru|uk|be|kk)/i.test(navigator.language||"") ? "ru" : "en"; }
  function load(lang){
    if (window.__AC) window.__AC.abort();
    window.__AC = new AbortController();
    const app=document.getElementById("app");
    app.innerHTML=""; app.appendChild(document.getElementById("tpl-"+lang).content.cloneNode(true));
    document.documentElement.lang=lang; document.title=TITLE[lang];
    window["__APP_"+lang]();
    document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  }
  document.addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    if (b.dataset.lang){ try{ localStorage.setItem("xt30-lang", b.dataset.lang); }catch(err){} load(b.dataset.lang); return; }
    if (b.dataset.copy){
      const txt=b.dataset.copy, done=()=>{ const o=b.textContent; b.textContent=b.dataset.done; setTimeout(()=>{ b.textContent=o; },1800); };
      const sel=()=>{ const m=b.parentElement.querySelector(".mail"); if(!m) return; const r=document.createRange(); r.selectNodeContents(m); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(txt).then(done, sel); } catch(err){ sel(); }
    }
  });
  load(pick());
})();
</script>
